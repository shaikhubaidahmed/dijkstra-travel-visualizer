<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
      integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script
      src="https://kit.fontawesome.com/5548f5ed00.js"
      crossorigin="anonymous"
    ></script>
    <script
      type="text/javascript"
      src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"
    ></script>
    <link rel="stylesheet" href="style.css" />
    <script src="scripts.js"></script>
  </head>

  <body>
    <nav
      class="navbar navbar-light"
      style="
        font-size: 25px;
        font-family: sans-serif;
        background-color: whitesmoke;
      "
    >
      <a
        href="https://github.com/shaikhubaidahmed/Graphs.git"
        width="124"
        height="45"
        class="d-inline-block align-top"
        alt="Link to github Repo"
        ><i class="fa-brands fa-github fa-2xl"></i
      ></a>
      Least time travel path project
    </nav>
    <div id="container">
      <div id="mynetwork"></div>
      <div id="container2">
        <span
          id="temptext2"
          style="width: 100%; text-align: center; font-size: x-large"
        >
        </span>
        <span
          id="temptext"
          style="width: 100%; text-align: center; font-size: x-large"
        >
          Bus link represents bus travel time :
          <i id="busIcon" class="fa fa-bus" aria-hidden="true"></i
          ><br />
          Flight link represents flight travel time :
          <i id="planeIcon" class="fa fa-plane" aria-hidden="true"></i
          ><br />
          Click on solve to get Solution !!
        </span>
        <div id="mynetwork2" style="display: none"></div>
      </div>
    </div>

    <div>
      <br />
      <button type="button" class="btn btn-danger" id="generate-graph">
        Get New Problem
      </button>
      <br />
      <button type="button" class="btn btn-success" id="solve">Solve</button>
    </div>

    <details id="settings">
      <summary>Settings</summary>
      <div class="form-row">
        <div class="form-group col-md-2">
          <label for="minNodes">Min nodes</label>
          <input type="number" class="form-control" id="minNodes" min="3" max="30" value="3" />
        </div>
        <div class="form-group col-md-2">
          <label for="maxNodes">Max nodes</label>
          <input type="number" class="form-control" id="maxNodes" min="3" max="30" value="10" />
        </div>
        <div class="form-group col-md-2">
          <label for="busMin">Bus min time</label>
          <input type="number" class="form-control" id="busMin" min="1" value="31" />
        </div>
        <div class="form-group col-md-2">
          <label for="busMax">Bus max time</label>
          <input type="number" class="form-control" id="busMax" min="1" value="100" />
        </div>
        <div class="form-group col-md-2">
          <label for="planeMin">Flight min time</label>
          <input type="number" class="form-control" id="planeMin" min="1" value="1" />
        </div>
        <div class="form-group col-md-2">
          <label for="planeMax">Flight max time</label>
          <input type="number" class="form-control" id="planeMax" min="1" value="50" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-md-2">
          <label for="maxHopBack">Max hop-back</label>
          <input type="number" class="form-control" id="maxHopBack" min="1" max="10" value="3" />
        </div>
        <div class="form-group col-md-2">
          <label for="extraEdgeRatio">Extra edges (%)</label>
          <input type="number" class="form-control" id="extraEdgeRatio" min="0" max="100" value="50" />
        </div>
        <div class="form-group col-md-2">
          <label for="busShareOfExtra">Extra-edge bus share (%)</label>
          <input type="number" class="form-control" id="busShareOfExtra" min="0" max="100" value="50" />
        </div>
        <div class="form-group col-md-2">
          <label for="nodeColor">Node color</label>
          <input type="color" class="form-control" id="nodeColor" value="#991133" />
        </div>
        <div class="form-group col-md-2">
          <label for="busColor">Bus color</label>
          <input type="color" class="form-control" id="busColor" value="#ffa500" />
        </div>
        <div class="form-group col-md-2">
          <label for="planeColor">Flight color</label>
          <input type="color" class="form-control" id="planeColor" value="#008000" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-md-2">
          <label for="srcSelect">Source</label>
          <select class="form-control" id="srcSelect"></select>
        </div>
        <div class="form-group col-md-2">
          <label for="dstSelect">Destination</label>
          <select class="form-control" id="dstSelect"></select>
        </div>
      </div>
      <small class="form-text text-muted">
        Changes to node/weight/edge settings apply on the next "Get New Problem". Source and
        destination apply immediately.
      </small>
    </details>
  </body>
</html>
